# SKL AGENT KIT Brain Configuration
# ---------------------------------------------------------
# Define NotebookLM resources that the agent can access.
# Run /brain-bootstrap or /brain-sync to set up project memory.

notebooks:
  project_master_brain:
    notebook_id: "your-notebook-id-here"
    title: "Project Master Brain"
    purpose: "Long-term memory for project architecture, MVP plan, domain rules"
    mode: auto  # Agent tu query khi can thiet
    sources:
      - "Project Requirements"
      - "Architecture Document"

  domain_knowledge_base:
    notebook_id: "your-second-notebook-id-here"
    title: "Domain Knowledge Database"
    purpose: "Heavy domain documents (e.g. textbooks, legal documents, PRDs)"
    mode: ask   # Agent se hoi User truoc khi query de tranh ton token
    sources: []
