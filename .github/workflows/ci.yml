name: SKL Agent Kit — Template Integrity CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Job 1: Broken link / reference check ───────────────────────────────────
  check-refs:
    name: Check document references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reference checker
        run: python tests/check_refs.py

  # ── Job 2: YAML config validation + required-file presence ─────────────────
  validate-configs:
    name: Validate YAML configs & required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run config validator
        run: python tests/validate_config.py

  # ── Job 3: YAML syntax check on all .yaml files ────────────────────────────
  yaml-lint:
    name: YAML syntax lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all YAML files
        run: |
          yamllint \
            --config-data "{extends: relaxed, rules: {line-length: {max: 200}, truthy: disable}}" \
            .agents/config/*.yaml \
            .agents/runtime/*.yaml \
            .agents/memory/entities.yaml

  # ── Job 4: Shell script syntax check ───────────────────────────────────────
  shellcheck:
    name: Shell script syntax (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Check setup.sh and update.sh
        run: shellcheck -S warning setup.sh update.sh
